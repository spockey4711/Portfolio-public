name: Build and publish image

# Continuous delivery for the public repo: build the production Docker image and
# publish it to the GitHub Container Registry (GHCR). The two long-lived branches
# each get their own image, because NEXT_PUBLIC_SITE_URL is inlined into the
# client bundle at build time and the environments must not share it:
#   - master  -> production image  (built for the apex domain)
#   - develop -> preview image     (built for the preview subdomain)
# This repo only builds and publishes the image. Rolling it out to a server is
# handled outside the public repo, so no deploy credentials (SSH keys, host,
# server paths) live here.
#
# Optional repository variables, baked in at build time; unset leaves the
# feature out of the build: NEXT_PUBLIC_ANALYTICS_SRC and
# NEXT_PUBLIC_ANALYTICS_WEBSITE_ID (cookieless analytics tag) and
# NEXT_PUBLIC_SENTRY_DSN (error tracking).

on:
  push:
    branches: [develop, master]

# Only the latest build per branch matters; cancel superseded runs.
concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the repo, and write the image to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the target environment from the pushed branch. Production
      # (master) and preview (develop) each get their own image, tagged under a
      # distinct prefix so they never overwrite each other; a per-env moving
      # `latest` tags the newest build. The image path is derived from the
      # repository name and must be lowercase for GHCR.
      - name: Resolve environment
        id: resolve
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            name=prod
            site_url=https://yannikwuenker.de
          else
            name=dev
            site_url=https://portfolio.yannikwuenker.de
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "site_url=${site_url}"
            printf 'tags<<EOF\n%s\nEOF\n' \
              "${image}:${name}-sha-${GITHUB_SHA::7}"$'\n'"${image}:${name}-latest"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.resolve.outputs.tags }}
          # NEXT_PUBLIC_* is inlined at build time, so these must be build args
          # (see the Dockerfile builder stage). The site URL is per-environment
          # (resolved from the branch above). The analytics and Sentry DSN vars
          # are optional: unset leaves the tracking tag / error tracking out of
          # the build.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.resolve.outputs.site_url }}
            NEXT_PUBLIC_ANALYTICS_SRC=${{ vars.NEXT_PUBLIC_ANALYTICS_SRC }}
            NEXT_PUBLIC_ANALYTICS_WEBSITE_ID=${{ vars.NEXT_PUBLIC_ANALYTICS_WEBSITE_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
