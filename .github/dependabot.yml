# Automated dependency updates (S2-10). Dependabot opens PRs against the
# `develop` integration branch - never `master`, which only moves via the
# periodic release PR (docs/engineering/git-workflow.md#releases-promoting-develop-to-master).
# CI (.github/workflows/ci.yml) runs the full gate on each PR before it can merge.
# See docs/engineering/dependency-updates.md.
version: 2
updates:
  # Application dependencies (pnpm lockfile). Minor and patch bumps are grouped
  # into a single PR to keep review overhead low; majors open individually so a
  # potential breaking change is reviewed on its own.
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Two majors are parked because the lint stack `eslint-config-next` pulls in
    # cannot take them yet - nothing in this repo can unblock either, so an
    # unignored bump would only reopen a permanently red PR every week:
    #   - eslint 10 removed `context.getFilename()`, which
    #     eslint-plugin-react still calls; its latest release (7.37.5), like
    #     eslint-plugin-jsx-a11y and eslint-plugin-import, still caps at
    #     `eslint ^9`, so `pnpm lint` crashes before it lints a file.
    #   - typescript-eslint refuses TS 7 outright ("does not support TS 7.0")
    #     and peers `typescript <6.1.0` up to and including its latest (8.70.0).
    #     `tsc --noEmit` itself already passes on TS 7 - only the lint step
    #     blocks, so this is purely a wait on upstream.
    # Recheck when a new eslint-config-next widens those peers; then drop the
    # matching entry here and let the major PR open again.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # GitHub Actions used by the CI and deploy workflows. Grouped together and
  # committed with the `ci` type since they touch the pipeline, not the app.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      github-actions:
        update-types:
          - minor
          - patch
