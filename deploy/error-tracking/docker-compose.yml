# Self-hosted, Sentry-compatible error tracking (GlitchTip) for the portfolio (S6-2).
#
# This is a STANDALONE stack, deliberately separate from the app's
# docker-compose.yml: it has its own datastore and lifecycle and is NOT built or
# deployed by the app's CI. Bring it up once, by hand, on the same Contabo VPS,
# following docs/operations/error-monitoring.md.
#
# GlitchTip binds to loopback only; Nginx is the sole public entry point and
# proxies errors.<domain> to 127.0.0.1:3003 over TLS - the same pattern as the
# app (:3000) and Umami (:3001). The firewall stays 22/80/443 only. Secrets (the
# Postgres password and Django SECRET_KEY) live in a sibling `.env` (mode 600),
# never in the repo - see .env.example.
#
# The app never talks to GlitchTip directly from the browser: @sentry/nextjs
# tunnels events through the app's own origin (next.config.ts `tunnelRoute`), so
# only the dashboard is exposed publicly and the ingest host stays server-side.

x-glitchtip-environment: &glitchtip-environment
  # POSTGRES_PASSWORD is interpolated raw into DATABASE_URL, so it must be
  # URL-safe (no `+`, `/`, `=`); generate it with `openssl rand -hex 24`.
  DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
  REDIS_URL: redis://glitchtip-redis:6379/0
  # Signs GlitchTip's own auth/session tokens. Generate once, keep stable:
  # `openssl rand -hex 32`. Rotating it logs dashboard users out.
  SECRET_KEY: ${SECRET_KEY}
  PORT: "8080"
  # Public base URL the dashboard and the DSN are built from; must match the
  # Nginx server_name and the app's NEXT_PUBLIC_SENTRY_DSN host.
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  # SMTP for alert e-mails, e.g. smtp://user:pass@host:587. Defaults to writing
  # mail to the container log (consolemail://) so the stack works without SMTP.
  EMAIL_URL: ${EMAIL_URL:-consolemail://}
  # A one-person instance: never let strangers self-register on the dashboard.
  ENABLE_OPEN_USER_REGISTRATION: "false"
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"

x-glitchtip-depends-on: &glitchtip-depends-on
  glitchtip-postgres:
    condition: service_healthy
  glitchtip-redis:
    condition: service_healthy

services:
  glitchtip-web:
    image: glitchtip/glitchtip:v4.2
    restart: unless-stopped
    depends_on: *glitchtip-depends-on
    environment: *glitchtip-environment
    ports:
      # Loopback only: reachable via Nginx, never directly from the internet.
      - "127.0.0.1:3003:8080"
    volumes:
      - glitchtip-uploads:/code/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_health/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.2
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on: *glitchtip-depends-on
    environment: *glitchtip-environment
    volumes:
      - glitchtip-uploads:/code/uploads

  glitchtip-migrate:
    image: glitchtip/glitchtip:v4.2
    # One-off: applies DB migrations, then exits. Compose treats a clean exit as
    # success; re-run `docker compose up glitchtip-migrate` after each image bump.
    command: ./bin/run-migrate.sh
    depends_on: *glitchtip-depends-on
    environment: *glitchtip-environment
    restart: "no"

  glitchtip-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - glitchtip-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - glitchtip-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  glitchtip-db-data:
  glitchtip-redis-data:
  glitchtip-uploads:
